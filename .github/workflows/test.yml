name: Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          # - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install getnf
        shell: bash
        run: bash tests/installer.sh
      - name: Install fonts
        shell: bash
        run: bash tests/fonts-install.sh
      - name: Uninstall fonts
        shell: bash
        run: bash tests/fonts-uninstall.sh

  safety:
    name: Offline safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Argument handling checks
        shell: bash
        run: bash tests/arguments.sh
      - name: Update exit-status checks
        shell: bash
        run: bash tests/update.sh
      - name: Download failure checks
        shell: bash
        run: bash tests/download.sh
      - name: Extraction failure checks
        shell: bash
        run: bash tests/extraction.sh
      - name: Uninstall safety checks
        shell: bash
        run: bash tests/uninstall-safety.sh
